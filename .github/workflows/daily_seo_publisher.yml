name: Patistore Saatlik SEO Icerik Otomasyonu

on:
  schedule:
    # Her saat basi (Gunde 24 saat, saatte 1 icerik) otomatik calisir
    - cron: '0 * * * *'
  # Manuel tek tusla tetikleme imkani
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish_hourly_article:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js Ortamini Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Saatte 1 Adet 2500+ Kelime RankMath 100/100 Icerigi Yayina Al
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node main.js --count=1 --status=publish

      - name: Yayin Gecmisini Guncelle ve Kaydet
        run: |
          git config --global user.name "Patistore SEO Bot"
          git config --global user.email "bot@patistore.net"
          git add data/history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: saatlik yayin gecmisi guncellendi [skip ci]"
          git push
